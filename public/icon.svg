<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1626"/>
      <stop offset="100%" stop-color="#0b0910"/>
    </linearGradient>
    <!-- userSpaceOnUse: the stem and foot are straight lines with a zero-area
         bounding box, and the default objectBoundingBox gradient degenerates to
         nothing on those, so they'd silently render invisible. -->
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="132" y1="140" x2="380" y2="400">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="55%" stop-color="#f7c250"/>
      <stop offset="100%" stop-color="#c4841a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="170" r="200" fill="#e8a628" opacity="0.10"/>

  <!-- bowl -->
  <path d="M132 156 L256 292 L380 156 Z"
        fill="none" stroke="url(#brass)" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- stem -->
  <path d="M256 292 L256 400"
        fill="none" stroke="url(#brass)" stroke-width="24" stroke-linecap="round"/>
  <!-- foot -->
  <path d="M180 400 L332 400"
        fill="none" stroke="url(#brass)" stroke-width="24" stroke-linecap="round"/>

  <!-- olive -->
  <circle cx="318" cy="200" r="27" fill="#7ddc9a"/>
  <circle cx="329" cy="191" r="9" fill="#b3701a"/>
</svg>
